[package]
authors = ["Will S. Medrano <will.s.medrano@gmail.com>"]
description = "livi is a library for hosting LV2 plugins."
documentation = "https://docs.rs/livi"
edition = "2024"
keywords = ["realtime", "audio", "lv2", "plugins", "music"]
license = "MIT"
name = "livi"
readme = "README.md"
repository = "https://github.com/wmedrano/livi-rs"
version = "0.8.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hound = "3.5.1"
lilv = "0.2.5"
log = "0.4"
lv2_raw = "0.3.0"
ringbuf = "0.4.8"

[dev-dependencies]
env_logger = "0.11.8"
jack = { version = "0.11" }
lazy_static = "1.4"
structopt = "0.3"
tempfile = "3.21.0"
lv2-sys = "2"

[patch.crates-io]
lilv = { git = "https://github.com/mlm-games/lilv-rs", branch = "main" }
lv2_raw = { git = "https://github.com/mlm-games/lv2_raw" }
lilv-sys = { git = "https://github.com/mlm-games/lilv-sys-rs", branch = "main" }
